# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── AWS Credentials ───────────────────────────────────────────────────────────
# Leave access-key and secret-key blank to use DefaultCredentialsProvider
# (recommended for EC2/ECS with IAM roles, or local ~/.aws/credentials)
aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ── S3 Bucket ─────────────────────────────────────────────────────────────────
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:your-bucket-name}

# ── Multipart Upload Size Limits ──────────────────────────────────────────────
# Allow up to 5 GB per request (Spring default is 1 MB — increase for large files)
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.aws.s3=INFO
logging.level.software.amazon.awssdk=WARN
